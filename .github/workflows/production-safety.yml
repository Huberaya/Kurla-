name: KURLA production safety

on:
  pull_request:
  push:
    branches: [main]
  # Une exécution par nuit, en plus de chaque push.
  #
  # Pourquoi : un push ne voit que le code qu'il apporte. Une nuit voit ce
  # qui a bougé sans lui — une table disparue, un fournisseur tiers tombé,
  # une donnée modifiée à la main. La sonde d'endpoints tourne déjà toutes
  # les quinze minutes ; celle-ci exécute les ~130 bancs, ce qui est
  # infiniment plus lent et infiniment plus profond. D'où une fois par nuit,
  # pas une fois par heure.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_realdb:
        description: Run the destructive-safe Supabase integration suite against the configured staging project
        required: true
        default: false
        type: boolean

concurrency:
  group: production-safety-${{ github.ref }}
  cancel-in-progress: true

# `issues: write` : les deux pas d'alerte ouvrent une issue quand aucun
# webhook n'est configuré.
permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Typecheck, build and critical tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Node.js 22
        run: node -e "if (!process.versions.node.startsWith('22.')) { throw new Error('Node.js 22 requis, trouvé ' + process.versions.node); }"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run lint

      - name: Critical inventories
        run: |
          npm run test:route-inventory
          npm run test:admin-route-inventory
          npm run test:store-api-inventory

      - name: Growth and funnel tests
        run: |
          npm run test:growth-control
          npm run test:growth-funnel

      - name: Production build
        run: npm run build

      # Sur `main` seulement : une branche qui casse prévient déjà son auteur
      # par la vérification de la demande de tirage. Sur `main`, personne
      # n'attend l'échec — il faut le dire.
      - name: Alerter — la branche principale est cassée
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          node scripts/alerter.mjs \
            --source "Sécurité de production (typecheck, inventaires, build)" \
            --gravite critique \
            --detail "La branche principale ne passe plus les vérifications. Tant que c'est le cas, aucun déploiement ne doit être considéré comme sain."

  real-supabase:
    name: Real Supabase integration suite
    if: github.event_name == 'workflow_dispatch' && inputs.run_realdb == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Node.js 22
        run: node -e "if (!process.versions.node.startsWith('22.')) { throw new Error('Node.js 22 requis, trouvé ' + process.versions.node); }"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run real Supabase tests
        run: npm run test:realdb

      - name: Audit the Skin and Catalog truth layer
        run: npm run audit:truth -- --strict

  verify-production:
    name: Verify production alias after main deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm Node.js 22
        run: node -e "if (!process.versions.node.startsWith('22.')) { throw new Error('Node.js 22 requis, trouvé ' + process.versions.node); }"

      - name: Wait for and verify production
        env:
          KURLA_PROD_URL: https://kurlabeauty.vercel.app
        run: node scripts/verifier-deploiement.mjs --url "$KURLA_PROD_URL" --sha "$GITHUB_SHA" --attente 240

      # Le déploiement est en ligne, mais la vérification a échoué : commit
      # non servi, ou régression mesurée après la mise en ligne. C'est le
      # pire moment pour un silence — le code est en production.
      - name: Alerter — le déploiement ne s'est pas vérifié
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          node scripts/alerter.mjs \
            --source "Vérification du déploiement" \
            --gravite critique \
            --detail "Le commit poussé n'a pas été servi, ou la production a régressé juste après la mise en ligne. Vérifier /api/health et le tableau de bord Vercel."

  suite-complete:
    name: Suite complète — les ~130 bancs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Node.js 22
        run: node -e "if (!process.versions.node.startsWith('22.')) { throw new Error('Node.js 22 requis, trouvé ' + process.versions.node); }"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # Pourquoi ce travail existe
      #
      # Le dépôt compte ~130 bancs. Ce travail les exécute tous ; le travail
      # « validate », lui, n'en lance que quelques-uns, pour répondre vite.
      # Autrement dit : avant ce travail, un banc qui casse ne le faisait
      # savoir à personne — sauf à la personne qui pensait à taper « npm
      # test » à la main. Mesuré le 13/09/2026, 17 bancs n'étaient même
      # atteints par aucune commande.
      #
      # Le dépôt est public : les minutes d'intégration continue sont
      # gratuites. Rien ne justifiait donc de garder la suite à la main.
      - name: Run the full test suite
        run: npm test

      - name: Alerter — la suite complète a échoué
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          node scripts/alerter.mjs \
            --source "Suite complète (npm test)" \
            --gravite critique \
            --detail "Un des ~130 bancs a échoué. Le banc de rendu est à part (rendu-pages.yml) ; tout le reste passe par ici. Reproduire : npm test"
